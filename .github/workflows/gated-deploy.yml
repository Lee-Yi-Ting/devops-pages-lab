
name: Gated GitHub Pages Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source files
        shell: bash
        run: |
          set -e
          test -f README.md
          test -f index.md
          grep -Fq '<!--START_SECTION:activity-->' README.md
          grep -Fq '<!--END_SECTION:activity-->' README.md
          grep -Fq '{% include_relative README.md %}' index.md
          echo "Source validation passed!"

      - name: Download built website
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./downloaded-site

      - name: Extract website artifact
        shell: bash
        run: |
          mkdir -p ./site
          tar -xf ./downloaded-site/artifact.tar -C ./site

      - name: Validate generated HTML
        shell: bash
        run: |
          set -e
          test -f ./site/index.html
          grep -Fq 'Hi, I' ./site/index.html
          grep -Fq 'Recent activity' ./site/index.html
          echo "Generated HTML validation passed!"

  deploy:
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

